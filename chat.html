<script>
/* PHRASES */

const PHRASES = [
  { text: '"Break the ice"', meaning: 'Start a conversation in a social situation' },
  { text: '"Under the weather"', meaning: 'Feeling slightly ill or unwell' },
  { text: '"Hit the nail on the head"', meaning: 'Describe exactly what is happening' },
  { text: '"Bite the bullet"', meaning: 'Endure a painful or difficult situation' },
  { text: '"On the same page"', meaning: 'In agreement and thinking the same way' },
  { text: '"Piece of cake"', meaning: 'Something very easy to do' },
];

const chosen = PHRASES[Math.floor(Math.random()*PHRASES.length)];

document.getElementById('phraseText').textContent = chosen.text;
document.getElementById('phraseMeaning').textContent = chosen.meaning;


/* STARFIELD */

const starCanvas = document.getElementById('starCanvas');
const sctx = starCanvas.getContext('2d');

let W,H;

function resize(){
  W = starCanvas.width = innerWidth;
  H = starCanvas.height = innerHeight;
}

resize();
addEventListener('resize',resize);

const stars = [];

for(let i=0;i<180;i++){
  stars.push({
    x:Math.random()*W,
    y:Math.random()*H,
    r:Math.random()*1.5,
    a:Math.random(),
    v:Math.random()*0.2
  });
}

function drawStars(){
  sctx.clearRect(0,0,W,H);

  stars.forEach(s=>{
    s.y += s.v;

    if(s.y > H){
      s.y = -10;
      s.x = Math.random()*W;
    }

    sctx.globalAlpha = s.a;

    sctx.beginPath();
    sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    sctx.fillStyle = 'white';
    sctx.fill();
  });

  requestAnimationFrame(drawStars);
}

drawStars();


/* ORB STATES */

let orbState = 'idle';

function setState(state){
  orbState = state;

  const voiceStatus = document.getElementById('voiceStatus');

  if(state === 'listening'){
    voiceStatus.textContent = 'Listening...';
  }

  if(state === 'thinking'){
    voiceStatus.textContent = 'Thinking...';
  }

  if(state === 'speaking'){
    voiceStatus.textContent = 'Speaking...';
  }
}


/* SMALL ORB */

const orbCanvas = document.getElementById('orbButtonCanvas');
const orbCtx = orbCanvas.getContext('2d');

let phase = 0;
let energy = 0;

function renderSmallOrb(){

  orbCtx.clearRect(0,0,150,150);

  let target = 0.1;

  if(orbState === 'listening') target = 0.6;
  if(orbState === 'thinking') target = 0.35;
  if(orbState === 'speaking') target = 0.9;

  energy += (target-energy)*0.08;

  phase += 0.03;

  const CX = 75;
  const CY = 75;
  const R = 42;

  for(let i=3;i>=1;i--){

    orbCtx.beginPath();

    orbCtx.arc(
      CX,
      CY,
      R + i*10 + energy*16,
      0,
      Math.PI*2
    );

    let alpha = energy*0.16/i;

    orbCtx.fillStyle =
      orbState === 'thinking'
      ? `rgba(168,85,247,${alpha})`
      : `rgba(75,127,255,${alpha})`;

    orbCtx.fill();
  }

  orbCtx.beginPath();

  for(let i=0;i<=80;i++){

    const angle = (i/80)*Math.PI*2;

    let bump = Math.sin(angle*5 + phase*2) * energy * 12;

    const rr = R + bump;

    const x = CX + Math.cos(angle)*rr;
    const y = CY + Math.sin(angle)*rr;

    if(i===0){
      orbCtx.moveTo(x,y);
    }else{
      orbCtx.lineTo(x,y);
    }
  }

  orbCtx.closePath();

  const grd = orbCtx.createRadialGradient(CX-12,CY-12,0,CX,CY,R+30);

  grd.addColorStop(0,'#cde2ff');
  grd.addColorStop(1,'#14224f');

  orbCtx.fillStyle = grd;
  orbCtx.fill();

  requestAnimationFrame(renderSmallOrb);
}

renderSmallOrb();


/* BIG ORB */

const voiceOrbCanvas = document.getElementById('voiceOrbCanvas');
const vctx = voiceOrbCanvas.getContext('2d');

let vPhase = 0;
let vEnergy = 0;

function renderBigOrb(){

  vctx.clearRect(0,0,340,340);

  let target = 0.1;

  if(orbState === 'listening') target = 0.7;
  if(orbState === 'thinking') target = 0.45;
  if(orbState === 'speaking') target = 1;

  vEnergy += (target-vEnergy)*0.06;

  vPhase += 0.025;

  const CX = 170;
  const CY = 170;
  const R = 100;

  for(let i=4;i>=1;i--){

    vctx.beginPath();

    vctx.arc(
      CX,
      CY,
      R + i*14 + vEnergy*20,
      0,
      Math.PI*2
    );

    let alpha = vEnergy*0.18/i;

    vctx.fillStyle =
      orbState === 'thinking'
      ? `rgba(168,85,247,${alpha})`
      : `rgba(75,127,255,${alpha})`;

    vctx.fill();
  }

  vctx.beginPath();

  for(let i=0;i<=120;i++){

    const angle = (i/120)*Math.PI*2;

    let bump = 0;

    if(orbState === 'listening'){
      bump = Math.sin(angle*9 + vPhase*5)*vEnergy*14;
    }

    if(orbState === 'thinking'){
      bump = Math.sin(angle*5 + vPhase*2)*vEnergy*10;
    }

    if(orbState === 'speaking'){
      bump =
        Math.sin(angle*12 + vPhase*5)*vEnergy*22 +
        Math.sin(angle*6 - vPhase*3)*vEnergy*10;
    }

    const rr = R + bump;

    const x = CX + Math.cos(angle)*rr;
    const y = CY + Math.sin(angle)*rr;

    if(i===0){
      vctx.moveTo(x,y);
    }else{
      vctx.lineTo(x,y);
    }
  }

  vctx.closePath();

  const grd = vctx.createRadialGradient(CX-20,CY-24,0,CX,CY,R+50);

  if(orbState === 'thinking'){
    grd.addColorStop(0,'#d9c8ff');
    grd.addColorStop(1,'#1d0b42');
  }else{
    grd.addColorStop(0,'#d5e6ff');
    grd.addColorStop(1,'#10214f');
  }

  vctx.fillStyle = grd;
  vctx.fill();

  requestAnimationFrame(renderBigOrb);
}

renderBigOrb();


/* CHAT FEED */

const feed = document.getElementById('live-chat-feed');

function appendMsg(role,text){

  const div = document.createElement('div');

  div.className = 'msg ' + role;

  div.textContent = text;

  feed.appendChild(div);

  feed.scrollTop = feed.scrollHeight;
}


/* VOICE MODE */

const micBtn = document.getElementById('micBtn');
const overlay = document.getElementById('voiceOverlay');
const endBtn = document.getElementById('voiceEndBtn');

let pc = null;
let dc = null;
let remoteAudio = null;

micBtn.addEventListener('click', openVoiceMode);
endBtn.addEventListener('click', closeVoiceMode);

async function openVoiceMode(){

  document.querySelector('.orb-shell').classList.add('active');

  overlay.classList.add('active');

  setState('thinking');

  try{

    const tokenRes = await fetch('/api/realtime-token');
    const tokenData = await tokenRes.json();

    const EPHEMERAL_KEY = tokenData?.value || tokenData?.client_secret?.value;

    pc = new RTCPeerConnection();

    remoteAudio = document.createElement('audio');
    remoteAudio.autoplay = true;

    pc.ontrack = e=>{
      remoteAudio.srcObject = e.streams[0];
    };

    const ms = await navigator.mediaDevices.getUserMedia({audio:true});

    pc.addTrack(ms.getTracks()[0]);

    dc = pc.createDataChannel('oai-events');

    dc.onopen = ()=>{

      setState('listening');

      dc.send(JSON.stringify({
        type:'session.update',
        session:{
          input_audio_transcription:{model:'whisper-1'}
        }
      }));
    };

    dc.onmessage = e=>{

      const msg = JSON.parse(e.data);

      if(msg.type === 'response.created'){
        setState('thinking');
      }

      if(msg.type === 'response.output_item.added'){
        setState('speaking');
      }

      if(msg.type === 'response.done'){
        setState('listening');
      }

      if(msg.type === 'conversation.item.input_audio_transcription.completed'){
        appendMsg('user', msg.transcript);
      }

      if(
        msg.type === 'response.audio_transcript.done' ||
        msg.type === 'response.output_audio_transcript.done'
      ){
        appendMsg('ai', msg.transcript || '...');
      }
    };

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    const sdpRes = await fetch(
      'https://api.openai.com/v1/realtime/calls',
      {
        method:'POST',
        body:offer.sdp,
        headers:{
          Authorization:`Bearer ${EPHEMERAL_KEY}`,
          'Content-Type':'application/sdp'
        }
      }
    );

    const answer = {
      type:'answer',
      sdp:await sdpRes.text()
    };

    await pc.setRemoteDescription(answer);

  }catch(err){

    console.error(err);

    closeVoiceMode();
  }
}

function closeVoiceMode(){

  overlay.classList.remove('active');

  document.querySelector('.orb-shell').classList.remove('active');

  setState('idle');

  if(dc){
    dc.close();
    dc = null;
  }

  if(pc){

    pc.getSenders().forEach(sender=>{
      if(sender.track){
        sender.track.stop();
      }
    });

    pc.close();

    pc = null;
  }
}
</script>

</body>
</html>
