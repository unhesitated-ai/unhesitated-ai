<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>unhesitated.ai</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#050816;
  --panel:#0d1325;
  --panel2:#121a31;
  --border:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.6);
  --blue:#4B7FFF;
  --blue2:#7da2ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'DM Sans',sans-serif;
  background:radial-gradient(circle at top,#0c1738,#050816 70%);
  color:white;
  min-height:100vh;
  overflow:hidden;
}

/* BACKGROUND */

.bg-glow{
  position:fixed;
  width:700px;
  height:700px;
  border-radius:50%;
  filter:blur(120px);
  pointer-events:none;
}

.bg-glow.one{
  top:-250px;
  left:-250px;
  background:rgba(75,127,255,0.12);
}

.bg-glow.two{
  bottom:-300px;
  right:-300px;
  background:rgba(140,90,255,0.12);
}

/* MAIN */

.wrapper{
  position:relative;
  z-index:2;
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px 20px;
}

.chat-shell{
  width:100%;
  max-width:720px;
  height:90vh;

  background:rgba(12,18,35,0.82);

  border:1px solid var(--border);

  backdrop-filter:blur(18px);

  border-radius:28px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* HEADER */

.topbar{
  padding:22px 28px;
  border-bottom:1px solid var(--border);

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-family:'Sora',sans-serif;
  font-weight:700;
  font-size:1.1rem;
}

.logo span{
  color:var(--blue);
}

.status{
  font-size:0.85rem;
  color:var(--muted);
}

/* COMPANIONS */

.companions{
  padding:22px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  border-bottom:1px solid var(--border);
}

@media(max-width:700px){
  .companions{
    grid-template-columns:repeat(2,1fr);
  }
}

.companion{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:18px;
  padding:18px 10px;
  text-align:center;
  cursor:pointer;
  transition:0.25s ease;
}

.companion:hover{
  transform:translateY(-2px);
  border-color:rgba(75,127,255,0.35);
}

.companion.active{
  background:rgba(75,127,255,0.12);
  border-color:rgba(75,127,255,0.6);
}

.avatar{
  width:52px;
  height:52px;
  margin:auto;
  margin-bottom:12px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:1.3rem;

  background:radial-gradient(circle,#4B7FFF,#13214a);
}

.cname{
  font-family:'Sora',sans-serif;
  font-size:0.92rem;
}

/* FEED */

.feed{
  flex:1;
  overflow-y:auto;
  padding:24px;

  display:flex;
  flex-direction:column;
  gap:14px;
}

.msg{
  max-width:80%;
  padding:14px 16px;
  border-radius:18px;
  line-height:1.5;
  font-size:0.95rem;
}

.msg.user{
  align-self:flex-end;
  background:rgba(75,127,255,0.18);
  border:1px solid rgba(75,127,255,0.25);
}

.msg.ai{
  align-self:flex-start;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
}

/* CONTROLS */

.controls{
  padding:26px;
  border-top:1px solid var(--border);

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}

.orb{
  width:140px;
  height:140px;
  border-radius:50%;
  cursor:pointer;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    radial-gradient(circle at 30% 30%,
    rgba(255,255,255,0.22),
    rgba(18,33,82,1));

  box-shadow:
    0 0 50px rgba(75,127,255,0.35),
    inset 0 0 25px rgba(255,255,255,0.04);

  transition:0.3s ease;
}

.orb.active{
  transform:scale(1.05);
}

.orb canvas{
  width:100%;
  height:100%;
  border-radius:50%;
}

.voice-status{
  font-family:'Sora',sans-serif;
  font-size:0.82rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--blue2);
}

.end-btn{
  border:none;
  background:rgba(255,255,255,0.06);
  color:white;
  padding:12px 24px;
  border-radius:50px;
  cursor:pointer;
  transition:0.25s ease;
}

.end-btn:hover{
  background:rgba(255,255,255,0.12);
}

.error{
  color:#ff9090;
  font-size:0.88rem;
}

</style>
</head>

<body>

<div class="bg-glow one"></div>
<div class="bg-glow two"></div>

<div class="wrapper">

<div class="chat-shell">

<!-- HEADER -->

<div class="topbar">

<div class="logo">
unhesitated<span>.ai</span>
</div>

<div class="status" id="connectionStatus">
Idle
</div>

</div>

<!-- COMPANIONS -->

<div class="companions" id="companions"></div>

<!-- CHAT FEED -->

<div class="feed" id="feed"></div>

<!-- CONTROLS -->

<div class="controls">

<div class="orb" id="micBtn">
<canvas id="orbCanvas" width="140" height="140"></canvas>
</div>

<div class="voice-status" id="voiceStatus">
Tap To Speak
</div>

<button class="end-btn" id="endBtn">
End Conversation
</button>

<div class="error" id="errorBox"></div>

</div>

</div>

</div>

<script>

/* ─────────────────────────────
   COMPANIONS
───────────────────────────── */

const MODELS = {

  orion:{ name:'Orion' },
  nova:{ name:'Nova' },
  arthur:{ name:'Arthur' },
  eleanor:{ name:'Eleanor' },
  kabir:{ name:'Kabir' },
  maya:{ name:'Maya' },
  ren:{ name:'Ren' },
  mei:{ name:'Mei' },
  amir:{ name:'Amir' },
  layla:{ name:'Layla' }
};

let selectedModel = 'nova';

const companionsEl =
  document.getElementById('companions');

Object.entries(MODELS).forEach(([key,val])=>{

  const div = document.createElement('div');

  div.className =
    'companion' +
    (key==='nova' ? ' active' : '');

  div.innerHTML = `
    <div class="avatar">🎙️</div>
    <div class="cname">${val.name}</div>
  `;

  div.onclick = ()=>{

    document
      .querySelectorAll('.companion')
      .forEach(c=>c.classList.remove('active'));

    div.classList.add('active');

    selectedModel = key;
  };

  companionsEl.appendChild(div);
});

/* ─────────────────────────────
   CHAT FEED
───────────────────────────── */

const feed =
  document.getElementById('feed');

function addMessage(role,text){

  const div =
    document.createElement('div');

  div.className =
    'msg ' + role;

  div.textContent = text;

  feed.appendChild(div);

  feed.scrollTop =
    feed.scrollHeight;
}

/* ─────────────────────────────
   UI ELEMENTS
───────────────────────────── */

const micBtn =
  document.getElementById('micBtn');

const voiceStatus =
  document.getElementById('voiceStatus');

const endBtn =
  document.getElementById('endBtn');

const errorBox =
  document.getElementById('errorBox');

const connectionStatus =
  document.getElementById('connectionStatus');

/* ─────────────────────────────
   ORB ANIMATION
───────────────────────────── */

const orbCanvas =
  document.getElementById('orbCanvas');

const ctx =
  orbCanvas.getContext('2d');

let orbState = 'idle';

let phase = 0;
let energy = 0;

function setState(state){

  orbState = state;

  if(state==='idle'){
    voiceStatus.textContent =
      'Tap To Speak';
  }

  if(state==='connecting'){
    voiceStatus.textContent =
      'Connecting...';
  }

  if(state==='listening'){
    voiceStatus.textContent =
      'Listening...';
  }

  if(state==='thinking'){
    voiceStatus.textContent =
      'Thinking...';
  }

  if(state==='speaking'){
    voiceStatus.textContent =
      'Speaking...';
  }
}

function animateOrb(){

  ctx.clearRect(0,0,140,140);

  let target = 0.1;

  if(orbState==='listening'){
    target = 0.7;
  }

  if(orbState==='thinking'){
    target = 0.4;
  }

  if(orbState==='speaking'){
    target = 1;
  }

  energy += (target-energy)*0.08;

  phase += 0.03;

  const cx = 70;
  const cy = 70;
  const r = 40;

  for(let i=3;i>=1;i--){

    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      r + i*8 + energy*16,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      `rgba(75,127,255,${
        energy*0.12/i
      })`;

    ctx.fill();
  }

  ctx.beginPath();

  for(let i=0;i<=80;i++){

    const angle =
      (i/80)*Math.PI*2;

    const bump =
      Math.sin(angle*8 + phase*3)
      * energy * 10;

    const rr = r + bump;

    const x =
      cx + Math.cos(angle)*rr;

    const y =
      cy + Math.sin(angle)*rr;

    if(i===0){
      ctx.moveTo(x,y);
    } else {
      ctx.lineTo(x,y);
    }
  }

  ctx.closePath();

  const grd =
    ctx.createRadialGradient(
      cx-12,
      cy-12,
      0,
      cx,
      cy,
      r+20
    );

  grd.addColorStop(0,'#dce8ff');
  grd.addColorStop(1,'#13214a');

  ctx.fillStyle = grd;
  ctx.fill();

  requestAnimationFrame(animateOrb);
}

animateOrb();

/* ─────────────────────────────
   REALTIME VOICE
───────────────────────────── */

let pc = null;
let dc = null;
let remoteAudio = null;

/* START */

micBtn.onclick = ()=>{

  if(pc){
    return;
  }

  startVoice();
};

/* END */

endBtn.onclick = ()=>{
  stopVoice();
};

/* START VOICE */

async function startVoice(){

  try {

    errorBox.textContent = '';

    setState('connecting');

    connectionStatus.textContent =
      'Connecting';

    micBtn.classList.add('active');

    /* TOKEN */

    const tokenRes =
      await fetch(
        `/api/realtime-token?model=${selectedModel}`
      );

    const tokenData =
      await tokenRes.json();

    console.log(tokenData);

    const EPHEMERAL_KEY =
      tokenData?.client_secret?.value;

    if(!EPHEMERAL_KEY){

      throw new Error(
        'No realtime token returned'
      );
    }

    /* PEER */

    pc = new RTCPeerConnection();

    remoteAudio =
      document.createElement('audio');

    remoteAudio.autoplay = true;

    document.body.appendChild(remoteAudio);

    pc.ontrack = e=>{
      remoteAudio.srcObject =
        e.streams[0];
    };

    /* MIC */

    const stream =
      await navigator.mediaDevices
      .getUserMedia({
        audio:true
      });

    stream.getTracks().forEach(track=>{
      pc.addTrack(track,stream);
    });

    /* DATA CHANNEL */

    dc =
      pc.createDataChannel(
        'oai-events'
      );

    dc.onopen = ()=>{

      console.log('Data channel open');

      setState('listening');

      connectionStatus.textContent =
        'Connected';
    };

    dc.onmessage = event=>{

      let msg;

      try{
        msg = JSON.parse(event.data);
      }catch{
        return;
      }

      console.log(msg);

      if(msg.type==='response.created'){
        setState('thinking');
      }

      if(msg.type==='response.done'){
        setState('listening');
      }

      if(
        msg.type===
        'response.output_item.added'
      ){
        setState('speaking');
      }

      /* USER TRANSCRIPT */

      if(
        msg.type===
        'conversation.item.input_audio_transcription.completed'
      ){

        const text =
          msg.transcript || '';

        addMessage('user',text);
      }

      /* AI TRANSCRIPT */

      if(
        msg.type===
        'response.audio_transcript.done'
        ||
        msg.type===
        'response.output_audio_transcript.done'
      ){

        const text =
          msg.transcript || '';

        addMessage('ai',text);
      }
    };

    /* OFFER */

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    /* OPENAI SDP */

    const sdpResponse =
      await fetch(
        'https://api.openai.com/v1/realtime?model=gpt-4o-realtime-preview-2024-12-17',
        {
          method:'POST',

          body:offer.sdp,

          headers:{
            Authorization:
              `Bearer ${EPHEMERAL_KEY}`,

            'Content-Type':
              'application/sdp'
          }
        }
      );

    if(!sdpResponse.ok){

      const err =
        await sdpResponse.text();

      throw new Error(err);
    }

    const answer =
      await sdpResponse.text();

    await pc.setRemoteDescription({
      type:'answer',
      sdp:answer
    });

    console.log(
      'Realtime connected'
    );

  } catch(err){

    console.error(err);

    errorBox.textContent =
      'Voice connection failed';

    stopVoice();
  }
}

/* STOP */

function stopVoice(){

  setState('idle');

  connectionStatus.textContent =
    'Idle';

  micBtn.classList.remove('active');

  if(dc){
    try{
      dc.close();
    }catch{}
    dc = null;
  }

  if(pc){

    pc.getSenders().forEach(sender=>{

      if(sender.track){
        sender.track.stop();
      }
    });

    try{
      pc.close();
    }catch{}

    pc = null;
  }

  if(remoteAudio){

    remoteAudio.srcObject = null;

    if(remoteAudio.parentNode){
      remoteAudio.parentNode
      .removeChild(remoteAudio);
    }

    remoteAudio = null;
  }
}

</script>

</body>
</html>
