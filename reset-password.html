<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>unhesitatedai — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg-void: #03050D;
    --electric: #4B7FFF;
    --electric-bright: #6B9FFF;
    --white: #FFFFFF;
    --white-muted: rgba(255,255,255,0.60);
    --white-faint: rgba(255,255,255,0.22);
    --border-glass: rgba(255,255,255,0.07);
    --ease: cubic-bezier(0.25,0.46,0.45,0.94);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-void); color: var(--white);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: rgba(8,13,26,0.80);
    border: 1px solid var(--border-glass);
    border-radius: 16px; padding: 48px;
    width: 100%; max-width: 420px; text-align: center;
  }
  .logo { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.4rem; margin-bottom: 32px; display: block; text-decoration: none; color: white;}
  .logo .dot-ai { color: var(--electric); font-weight: 400; }
  h2 { font-family: 'Sora', sans-serif; font-size: 1.5rem; margin-bottom: 12px; }
  p { color: var(--white-muted); font-size: 0.9rem; margin-bottom: 24px; }
  
  .input-wrapper { position: relative; display: flex; align-items: center; width: 100%; margin-bottom: 20px;}
  input {
    width: 100%; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-glass); border-radius: 8px;
    padding: 14px 48px 14px 16px; color: var(--white);
    font-family: 'DM Sans', sans-serif; font-size: 1rem; outline: none;
  }
  input:focus { border-color: var(--electric); }
  
  .toggle-password {
    position: absolute; right: 12px;
    background: transparent; border: none; padding: 4px;
    color: var(--white-faint); cursor: pointer;
  }
  .toggle-password:hover { color: var(--white); }
  .toggle-password svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

  .btn {
    width: 100%; padding: 14px; background: var(--electric);
    border: none; border-radius: 50px; color: var(--white);
    font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: all 0.3s var(--ease);
  }
  .btn:hover { background: var(--electric-bright); }
  .msg { margin-top: 16px; font-size: 0.85rem; color: #fca5a5; display: none; }
  .success { color: var(--electric-bright); }
</style>
</head>
<body>

<div class="card">
  <a href="index.html" class="logo">unhesitated<span class="dot-ai">ai</span></a>
  <h2>Secure Your Account</h2>
  <p>Enter a new password for your account.</p>

  <div class="input-wrapper">
    <input id="new-password" type="password" placeholder="New password (min 8 chars)" />
    <button type="button" class="toggle-password" onclick="togglePass()" aria-label="Show password">
      <svg class="eye-show" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-hide" style="display:none;" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
    </button>
  </div>
  
  <button class="btn" onclick="updatePassword()">Update Password</button>
  <div id="msg" class="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── CONFIG ──
  const SUPABASE_URL  = 'https://hgiricwmrswqucaveckx.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_dvLA7kbFstY9X_DopLEHOA_oBX16bPC';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

  function togglePass() {
    const inp = document.getElementById('new-password');
    const show = document.querySelector('.eye-show');
    const hide = document.querySelector('.eye-hide');
    if(inp.type === 'password') { inp.type = 'text'; show.style.display = 'none'; hide.style.display = 'block'; }
    else { inp.type = 'password'; show.style.display = 'block'; hide.style.display = 'none'; }
  }

  function showMsg(text, isSuccess = false) {
    const m = document.getElementById('msg');
    m.textContent = text; m.style.display = 'block';
    m.className = isSuccess ? 'msg success' : 'msg';
  }

  async function updatePassword() {
    const pass = document.getElementById('new-password').value;
    if (pass.length < 8) return showMsg('Password must be at least 8 characters.');
    
    // Supabase magically reads the secure token from the URL!
    const { error } = await sb.auth.updateUser({ password: pass });
    
    if (error) {
      showMsg(error.message);
    } else {
      showMsg('Password updated successfully! Redirecting...', true);
      setTimeout(() => window.location.href = 'chat.html', 1500);
    }
  }
</script>
</body>
</html>
